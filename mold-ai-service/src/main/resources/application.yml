server:
  port: 7090

spring:
  application:
    name: mold-ai-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mold_ai_db?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

# Mybatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# 霉菌AI模块专用配置
mold-ai:
  tdengine:
    url: jdbc:TAOS://172.22.2.122:6030/animal_husbandry
    username: root
    password: taosdata
  
  jeecg:
    api-url: http://localhost:8080/jeecg-boot
    api-token: system_integration_token_placeholder

  # 算法与调度配置
  algorithm:
    window-days: 7       # 默认7天，方便修改 (测试时可改为30)
    decay-factor: 0.95
  
  scheduler:
    enabled: true        # 是否开启定时任务
    cron: "0/30 * * * * ?"  # 测试：每30秒执行一次
    batch-size: 20

  # 告警配置 (新增)
  alarm:
    enabled: true
    webhook-url: "" # 钉钉/企微 Webhook，留空则只打印日志

logging:
  level:
    com.moldai: debug
    org.springframework: info
